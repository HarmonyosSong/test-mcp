# version 3: targets (appid / APM) are first-class; stores only hold SLS physical coords.
# descriptions 统一模板（2026-11-11 真实抽样核对）：
#   SLS:  {产品/端}（platform/form，appid=…，store=…）。样本主事件：…。
#   APM:  培优{形态}客户端 APM（service_id=…，app_clientid=…）。近1h 可见 monitorLogType …
version: 3
vendor: aliyun
defaults:
  region: cn-beijing
  account: "1743276692096170"
  collection: pysy-front-log
  time: 1h

# Thin SLS coordinates only — no business aliases here.
stores:
  - id: prod-android
    topic: prod-android
    env: prod
    description: 阿里云 SLS Logstore（Android 埋点物理库）
  - id: prod-cloudlearn
    topic: prod-cloudlearn
    env: prod
    description: 阿里云 SLS Logstore（云学习 H5 埋点物理库）
    notes: [appid_not_sql_groupable, use_fulltext_or_where]
  - id: prod-ios
    topic: prod-ios
    env: prod
    description: 阿里云 SLS Logstore（iOS / 鸿蒙 / 装扮商城等共用物理库，靠 appid 区分）

# Resolve matches targets first; query coords come from store_ref or service_id.
targets:
  # --- Aliyun SLS product_event (Android store) ---
  - id: log-eagle-0005-prod
    source: aliyun_sls
    log_kind: product_event
    platform: android
    client_form: phone
    product_line: xueersi
    store_ref: prod-android
    aliases: [语音测评, 口语测评SDK, TalVoiceEval, 测评SDK, 安卓语音测评, log-eagle-0005]
    description: Android 语音测评 SDK 埋点（appid=log-eagle-0005-prod，store=prod-android）。样本主事件：eventname=TalVoiceEvalManager；pageid 常见彼芯托管/学而思HD/学而思/云课堂；eventid 常见初始化/英语绘本/新口语岛。
    key_fields: [pageid, eventid, eventname, desc]
    notes: [product_event_not_apm, verified_sample_2026-11-11]
    businesses:
      - name: 云课堂测评初始化
        aliases: [云课堂测评]
        match: { pageid: 云课堂, eventname: TalVoiceEvalManager }
      - name: 英语绘本测评
        aliases: [英语绘本Android]
        match: { pageid: 学而思HD, eventid: 英语绘本 }
      - name: 背单词测评
        aliases: [背单词Android]
        match: { pageid: 学而思, eventid: 背单词 }

  - id: log-fe-native-android-001-prod
    source: aliyun_sls
    log_kind: product_event
    platform: android
    client_form: phone
    product_line: xueersi
    store_ref: prod-android
    aliases: [安卓, 安卓AI, Android WS, 小思WS, Android WebSocket, 安卓埋点, log-fe-native-android-001]
    description: Android AI 链路埋点（appid=log-fe-native-android-001-prod，store=prod-android）。样本主事件：eventname=WS（WS_POINT_* 收发/断开）与 ASR（识别起止）；pageid 常见 AiFullScreenDialog。
    key_fields: [pageid, eventid, eventname, desc]
    notes: [product_event_not_apm, verified_sample_2026-11-11]
    businesses:
      - name: AI WebSocket
        aliases: [WS链路]
        match: { eventname: WS }
      - name: ASR 识别
        aliases: [安卓ASR]
        match: { eventname: ASR }

  # --- Aliyun SLS product_event (cloudlearn store) ---
  # prod-cloudlearn：appid/pageid 非 KV 索引；查 appid 用全文 "log-eagle-xxxx" 或 `* | where appid='…'`
  - id: log-eagle-0008-prod
    source: aliyun_sls
    log_kind: product_event
    platform: h5
    client_form: h5
    product_line: xueersi
    store_ref: prod-cloudlearn
    aliases: [口语岛, 新口语岛, log-eagle-0008]
    description: 新口语岛 H5 埋点（appid=log-eagle-0008-prod，store=prod-cloudlearn）。样本主事件：pageid=新口语岛；renderEngineModule / evaluationModule（clickid=oralIsLandRenderEngineReport / oralIsLandPractiseEvaluationResult）。
    key_fields: [pageid, eventid, eventname, desc, clickid, uid, customtraceid, status]
    notes: [appid_not_sql_groupable, use_fulltext_or_where, product_event_not_apm, verified_sample_2026-11-11]
    businesses:
      - name: 渲染引擎上报
        aliases: [口语岛渲染]
        match:
          pageid: 新口语岛
          eventid: renderEngineModule
          clickid: oralIsLandRenderEngineReport
      - name: 测评结果
        aliases: [口语岛测评]
        match:
          pageid: 新口语岛
          eventid: evaluationModule
          clickid: oralIsLandPractiseEvaluationResult

  - id: log-eagle-0009-prod
    source: aliyun_sls
    log_kind: product_event
    platform: h5
    client_form: h5
    product_line: xueersi
    store_ref: prod-cloudlearn
    aliases: [英语绘本, 绘本馆, 英语绘本馆, log-eagle-0009]
    description: 英语绘本馆 H5 埋点（appid=log-eagle-0009-prod，store=prod-cloudlearn）。样本主事件：pageid=英语绘本馆；evaluationModule 测评结果为主，另有 speakSubmitModule、studentLoginModule、invokeJsBridgeModule。
    key_fields: [pageid, eventid, eventname, desc, clickid, uid, status]
    notes: [appid_not_sql_groupable, use_fulltext_or_where, product_event_not_apm, verified_sample_2026-11-11]
    businesses:
      - name: 语音测评结果
        aliases: [绘本测评]
        match:
          pageid: 英语绘本馆
          eventid: evaluationModule
          clickid: evaluationResult
      - name: 学员登录
        aliases: [绘本登录]
        match: { pageid: 英语绘本馆, eventid: studentLoginModule }

  - id: log-eagle-0016-prod
    source: aliyun_sls
    log_kind: product_event
    platform: h5
    client_form: h5
    product_line: xueersi
    store_ref: prod-cloudlearn
    aliases: [磨耳朵, log-eagle-0016]
    description: 磨耳朵 H5 播放埋点（appid=log-eagle-0016-prod，store=prod-cloudlearn）。样本主事件：pageid=磨耳朵，eventid=grindingearPlayAudioModule；clickid 为 Native↔H5 双向桥接。
    key_fields: [pageid, eventid, eventname, desc, clickid, uid, customtraceid]
    notes: [appid_not_sql_groupable, use_fulltext_or_where, product_event_not_apm, verified_sample_2026-11-11]
    businesses:
      - name: 音频播放桥接
        aliases: [磨耳朵播放]
        match: { pageid: 磨耳朵, eventid: grindingearPlayAudioModule }

  # --- Aliyun SLS product_event (prod-ios physical store: iOS + Harmony + mall share topic) ---
  - id: log-fe-native-iOS-001-prod
    source: aliyun_sls
    log_kind: product_event
    platform: ios
    client_form: phone
    product_line: xueersi
    store_ref: prod-ios
    aliases: [iOS播放器, xes_player, 语音JSBridge, iOS埋点, ios原生, log-fe-native-iOS-001]
    description: iOS Native 播放器与语音评测 JSBridge 埋点（appid=log-fe-native-iOS-001-prod，store=prod-ios，OS=iOS）。样本主事件：xes_player/xes_player_buffer；另有 pageid=语音评测JSBridge 下 EnglishLibrary、EnglishSpeakIsland 录音链。
    key_fields: [pageid, eventid, eventname, desc, OS, bundleName]
    notes: [product_event_not_apm, verified_sample_2026-11-11]
    businesses:
      - name: 播放器缓冲
        aliases: [播放器缓冲进度]
        match: { eventid: xes_player_buffer, eventname: xes_player }
      - name: 绘本馆录音
        aliases: [EnglishLibrary录音]
        match: { pageid: 语音评测JSBridge, eventname: EnglishLibrary }
      - name: 口语岛录音
        aliases: [EnglishSpeakIsland录音]
        match: { pageid: 语音评测JSBridge, eventname: EnglishSpeakIsland }

  - id: log-fe-virtually-mall-prod

    key_fields: [pageid, eventid, eventname, desc, clickid, status, ua]
    notes: [product_event_not_apm, shares_prod_ios_store, verified_sample_2026-11-11]
    businesses:
      - name: 换装性能
        aliases: [换装耗时]
        match: { pageid: 装扮商城, eventid: CHANGE_SKIN }
      - name: 场景初始化
        aliases: [装扮场景初始化]

version: 1
vendor: aliyun
defaults:
  region: cn-beijing
  account: "1743276692096170"
  collection: pysy-front-log
  time: 1h

stores:
  - id: prod-android
    topic: prod-android
    env: prod
    aliases: [安卓, android, Android原生, Android]
    description: 培优 Android 端前端/Native 日志
    appids:
      - id: log-eagle-0005-prod
        aliases: [语音测评, 口语测评SDK, TalVoiceEval, 测评SDK]
        description: Android 语音测评 SDK
        key_fields: [pageid, eventid, eventname, desc]
        businesses:
          - name: 云课堂测评初始化
            aliases: [云课堂测评]
            match: { pageid: 云课堂, eventname: TalVoiceEvalManager }
          - name: 英语绘本测评
            aliases: [英语绘本Android]
            match: { pageid: 学而思HD, eventid: 英语绘本 }
          - name: 背单词测评
            aliases: [背单词Android]
            match: { pageid: 学而思, eventid: 背单词 }
      - id: log-fe-native-android-001-prod
        aliases: [安卓AI, Android WS, 小思WS, Android WebSocket]
        description: Android AI WebSocket 链路
        key_fields: [pageid, eventid, eventname, desc]
        businesses:
          - name: AI WebSocket
            aliases: [WS链路]
            match: { eventname: WS }

  - id: prod-cloudlearn
    topic: prod-cloudlearn
    env: prod
    aliases: [云学习H5, cloudlearn, 云学习前端, 云学习]
    description: 云学习 H5 埋点生产日志（appid 不宜 SQL group by，用检索条件精确筛）
    notes: [appid_not_sql_groupable]
    appids:
      - id: log-eagle-0008-prod
        aliases: [口语岛, 新口语岛]
        description: 新口语岛 H5
        key_fields: [pageid, eventid, eventname, desc, clickid, uid, customtraceid, status]
        businesses:
          - name: 渲染引擎上报
            aliases: [口语岛渲染]
            match:
              pageid: 新口语岛
              eventid: renderEngineModule
              clickid: oralIsLandRenderEngineReport
          - name: 测评结果
            aliases: [口语岛测评]
            match:
              pageid: 新口语岛
              eventid: evaluationModule
              clickid: oralIsLandPractiseEvaluationResult
      - id: log-eagle-0009-prod
        aliases: [英语绘本, 绘本馆, 英语绘本馆]
        description: 英语绘本馆 H5
        key_fields: [pageid, eventid, eventname, desc, clickid, uid, status]
        businesses:
          - name: 语音测评结果
            aliases: [绘本测评]
            match:
              pageid: 英语绘本馆
              eventid: evaluationModule
              clickid: evaluationResult
          - name: 学员登录
            aliases: [绘本登录]
            match: { pageid: 英语绘本馆, eventid: studentLoginModule }
      - id: log-eagle-0016-prod
        aliases: [磨耳朵]
        description: 磨耳朵 H5 播放
        key_fields: [pageid, eventid, eventname, desc, clickid, uid, customtraceid]
        businesses:
          - name: 音频播放桥接
            aliases: [磨耳朵播放]
            match: { pageid: 磨耳朵, eventid: grindingearPlayAudioModule }

  - id: prod-ios
    topic: prod-ios
    env: prod
    aliases: [iOS, 苹果, ios原生, iPhone, iPad]
    description: 培优 iOS 端日志
    appids:
      - id: log-fe-native-iOS-001-prod
        aliases: [iOS播放器, xes_player, 语音JSBridge]
        description: iOS Native 播放器与语音评测 JSBridge
        key_fields: [pageid, eventid, eventname, desc]
        businesses:
          - name: 播放器缓冲
            aliases: [播放器缓冲进度]
            match: { eventid: xes_player_buffer, eventname: xes_player }
          - name: 绘本馆录音
            aliases: [EnglishLibrary录音]
            match: { pageid: 语音评测JSBridge, eventname: EnglishLibrary }
          - name: 口语岛录音
            aliases: [EnglishSpeakIsland录音]
            match: { pageid: 语音评测JSBridge, eventname: EnglishSpeakIsland }
      - id: log-har-001-prod
        aliases: [iOS生命周期主量, iOS lifecycle]
        description: App 生命周期 / SLS 初始化（量大）
        key_fields: [pageid, eventid, eventname, desc]
      - id: log-har-002-prod
        aliases: [iOS语音评测链, VOICE_EVAL]
        description: 语音测评关键链 + WS + 生命周期
        key_fields: [pageid, eventid, eventname, desc]
      - id: log-fe-virtually-mall-prod
        aliases: [装扮商城, 换装]
        description: 装扮商城
        key_fields: [pageid, eventid, eventname, desc]
        businesses:
          - name: 换装性能
            aliases: [换装耗时]
            match: { pageid: 装扮商城, eventid: CHANGE_SKIN }
          - name: 场景初始化
            aliases: [装扮场景初始化]
            match: { pageid: 装扮商城, eventid: SCENE_INIT }
          - name: 购买装扮
            aliases: [买装扮]
            match: { pageid: 装扮商城, eventid: BUY_PAINTING }
      - id: log-har-003-prod
        aliases: [iOS课中生命周期]
        description: 课中/主观题等页生命周期
        key_fields: [pageid, eventid, eventname, desc]
      - id: log-har-004-prod
        aliases: [iOS生命周期少量]
        description: 生命周期（量少）
        key_fields: [pageid, eventid, eventname, desc]

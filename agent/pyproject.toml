[project]
name = "harmony-agent-core"
version = "0.1.0"
description = "PydanticAI orchestration core for HarmonyOS issue diagnosis"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4,<4.0",
  "harmony-repository-mcp",
  "pydantic-ai-slim[mcp,openai]>=2.35,<2.36",
  "pydantic-settings>=2.12,<3.0",
  "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "ruff>=0.15,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmony_agent"]

[tool.uv.sources]
harmony-repository-mcp = { path = "../mcp_server", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


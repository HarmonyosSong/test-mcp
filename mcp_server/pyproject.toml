[project]
name = "harmony-repository-mcp"
version = "0.1.0"
description = "Read-only repository inspection MCP server for Harmony Triage"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4,<4.0",
  "mcp>=1.29.1,<2.0",
  "pydantic>=2.12,<3.0",
  "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "ruff>=0.15,<1.0",
]

[project.scripts]
harmony-repository-mcp = "harmony_repo_mcp.server:run"
harmony-knowledge-mcp = "harmony_knowledge_mcp.server:run"
harmony-code-index-mcp = "harmony_code_index_mcp.server:run"
harmony-knowledge-validate = "harmony_knowledge_mcp.validate:_entrypoint"
harmony-knowledge-querylog = "harmony_knowledge_mcp.query_log:_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmony_repo_mcp", "src/harmony_knowledge_mcp", "src/harmony_code_index_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


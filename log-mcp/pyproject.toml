[project]
name = "log-mcp"
version = "0.1.0"
description = "独立运行的日志查询 MCP 服务（日志中心 + 阿里云 SLS），仅负责取日志，不承载业务语义"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "filelock>=3.16,<4",
    "httpx>=0.28.1,<1",
    "mcp>=2.3,<3",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17.0,<0.18",
]

[project.scripts]
log-mcp = "log_mcp.server:main"
start = "log_mcp.ctl:entry_start"
stop = "log_mcp.ctl:entry_stop"
restart = "log_mcp.ctl:entry_restart"
status = "log_mcp.ctl:entry_status"
check = "log_mcp.ctl:entry_check"
client = "log_mcp.ctl:entry_client"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/README.md",
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/log_mcp"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107"]
"src/log_mcp/ctl.py" = ["S603", "S607"]

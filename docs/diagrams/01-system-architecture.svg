<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" role="img" aria-labelledby="title description">
  <title id="title">Troubleshoot Odyssey 当前诊断主流程</title>
  <desc id="description">请求经准入后，默认先由客户端 Agent 观察日志、完成关联入账并读取固定源码快照。本地报告若给出明确跨侧问题，则自动创建外发审批，经 Compass 获取独立外部结论并生成联合报告；否则直接完成本地报告。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/>
    </marker>
    <marker id="arrow-external" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16816f"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #26364b; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5f6f84; }
      .section { font-size: 13px; font-weight: 700; fill: #62738a; }
      .heading { font-size: 18px; font-weight: 700; }
      .heading-compact { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; fill: #506177; }
      .small { font-size: 12px; fill: #65758a; }
      .frame { fill: #fbfcfe; stroke: #dce3eb; stroke-width: 1.5; }
      .client-frame { fill: #f5f8fc; stroke: #a9bdd6; stroke-width: 1.5; }
      .server-frame { fill: #f4fbf9; stroke: #9dc8bd; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #b8c5d3; stroke-width: 1.5; }
      .runtime { fill: #eef3fb; stroke: #91a8c7; stroke-width: 1.7; }
      .navigation { fill: #f1efff; stroke: #a99be0; stroke-width: 1.7; }
      .data { fill: #f1f6ed; stroke: #a5bc89; stroke-width: 1.7; }
      .boundary { fill: #fffaf0; stroke: #d99a3c; stroke-width: 1.7; stroke-dasharray: 7 5; }
      .external { fill: #eef7f6; stroke: #83b9ad; stroke-width: 1.7; }
      .edge { fill: none; stroke: #718299; stroke-width: 2; marker-end: url(#arrow); }
      .edge-external { fill: none; stroke: #16816f; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-external); }
      .edge-label { font-size: 12px; font-weight: 700; fill: #527066; }
    </style>
  </defs>

  <rect width="1400" height="1120" fill="#ffffff"/>
  <text x="54" y="54" class="title">当前一轮诊断：先观察，再取证，按需协查</text>
  <text x="54" y="84" class="subtitle">Supervisor 负责技术路由；老师只描述故障、补充事实，并在需要时确认外发内容</text>
  <text x="54" y="110" class="small">实线为本地主流程，绿色虚线为审批后的服务端协查；两条证据路径始终分开。</text>

  <rect x="54" y="132" width="1292" height="140" rx="12" class="frame"/>
  <text x="78" y="160" class="section">01 · 接入与调查计划</text>
  <rect x="82" y="182" width="220" height="64" rx="8" class="box"/>
  <text x="102" y="209" class="heading">用户问题</text>
  <text x="102" y="232" class="body">Web / 知音楼 IM</text>
  <rect x="380" y="182" width="300" height="64" rx="8" class="runtime"/>
  <text x="400" y="209" class="heading">Hono + RunAdmission</text>
  <text x="400" y="232" class="body">身份校验 · 会话互斥 · 全局并发</text>
  <rect x="780" y="164" width="520" height="96" rx="8" class="runtime"/>
  <text x="804" y="194" class="heading">Runtime Supervisor</text>
  <text x="804" y="218" class="body">默认 local；只有明确限定才直接生成 server</text>
  <text x="804" y="240" class="small">已有日志观测 + 服务端信号 + 请求关联 + 开关和预算，才允许 parallel</text>
  <path d="M 302 214 H 380" class="edge"/>
  <path d="M 680 214 H 780" class="edge"/>

  <rect x="54" y="300" width="1292" height="310" rx="12" class="client-frame"/>
  <text x="78" y="330" class="section">02 · 客户端主流程：observe → source → 本地报告</text>
  <text x="78" y="352" class="small">新工单没有 kind=log 时，即使带 traceId 和服务端关键词，也先走这里。</text>

  <rect x="82" y="382" width="200" height="140" rx="8" class="runtime"/>
  <text x="102" y="416" class="heading-compact">ClientDiagnosisAgent</text>
  <text x="102" y="448" class="body">Skill / Knowledge 提供候选</text>
  <text x="102" y="472" class="body">Runtime 私有注入学员标识</text>
  <text x="102" y="500" class="small">知识、目录与别名不是证据</text>

  <rect x="320" y="382" width="220" height="140" rx="8" class="box"/>
  <text x="340" y="416" class="heading">1 · 观察现场</text>
  <text x="340" y="448" class="body">LogCenter 发现 / 关联查询</text>
  <text x="340" y="472" class="body">或解析用户粘贴的 hilog</text>
  <text x="340" y="500" class="small">身份匹配日志提供平台与版本</text>

  <rect x="580" y="382" width="220" height="140" rx="8" class="data"/>
  <text x="600" y="416" class="heading">2 · 门禁与入账</text>
  <text x="600" y="448" class="body">目标绑定 + 当前身份匹配</text>
  <text x="600" y="472" class="body">脱敏日志逐条进入账本</text>
  <text x="600" y="500" class="small">空结果或失败可降级，不确认平台</text>

  <rect x="840" y="382" width="250" height="140" rx="8" class="navigation"/>
  <text x="860" y="416" class="heading">3 · 读取固定源码</text>
  <text x="860" y="448" class="body">Repository MCP · 会话原 commit</text>
  <text x="860" y="472" class="body">CBM / grep 只负责寻找候选</text>
  <text x="860" y="500" class="small">read 原文与调用上下文才形成证据</text>

  <rect x="1130" y="382" width="216" height="140" rx="8" class="data"/>
  <text x="1150" y="416" class="heading">4 · 校验本地报告</text>
  <text x="1150" y="448" class="body">证据 ID + 逐字摘录</text>
  <text x="1150" y="472" class="body">责任判断 + 信息缺口</text>
  <text x="1150" y="500" class="small">非法引用拒绝提交</text>

  <path d="M 282 452 H 320" class="edge"/>
  <path d="M 540 452 H 580" class="edge"/>
  <path d="M 800 452 H 840" class="edge"/>
  <path d="M 1090 452 H 1130" class="edge"/>

  <rect x="82" y="548" width="1000" height="42" rx="8" class="boundary"/>
  <text x="102" y="574" class="small">精确版本快照选择器已可用，但轮内自动换绑未接入；当前主流程仍读取会话固定 commit，旧证据保持原快照。</text>

  <rect x="54" y="640" width="1292" height="414" rx="12" class="server-frame"/>
  <text x="78" y="670" class="section">03 · 服务端协查：初始计划先审批；本地报告也可自动接续</text>

  <rect x="1130" y="700" width="216" height="100" rx="8" class="runtime"/>
  <text x="1150" y="734" class="heading-compact">需要服务端协查？</text>
  <text x="1150" y="760" class="body">本地报告给出明确跨侧问题</text>
  <text x="1150" y="782" class="small">Supervisor 判断，老师不选路由</text>
  <path d="M 1238 522 V 694" class="edge"/>

  <rect x="820" y="700" width="250" height="100" rx="8" class="external"/>
  <text x="844" y="734" class="heading">外发审批</text>
  <text x="844" y="760" class="body">固定脱敏摘要 · 批准前零请求</text>
  <text x="844" y="782" class="small">初始 server / parallel 同样先审批</text>
  <path d="M 1130 750 H 1076" class="edge-external"/>
  <text x="1090" y="736" class="edge-label">是</text>

  <rect x="500" y="700" width="250" height="100" rx="8" class="external"/>
  <text x="524" y="734" class="heading">Compass Slot</text>
  <text x="524" y="760" class="body">A2A JSON-RPC / SSE</text>
  <text x="524" y="782" class="small">预算、取消与输出限长</text>
  <path d="M 820 750 H 756" class="edge-external"/>

  <rect x="110" y="700" width="300" height="100" rx="8" class="external"/>
  <text x="134" y="734" class="heading">ExternalFindings</text>
  <text x="134" y="760" class="body">远端结论、任务状态、截断与限制</text>
  <text x="134" y="782" class="small">不进入本地 EvidenceLedger</text>
  <path d="M 500 750 H 416" class="edge-external"/>

  <rect x="110" y="862" width="640" height="88" rx="8" class="data"/>
  <text x="134" y="896" class="heading">联合诊断报告</text>
  <text x="134" y="922" class="body">本地已验证主张与仅远端支持的主张分开，保留冲突和缺口</text>
  <path d="M 260 800 V 856" class="edge-external"/>

  <rect x="1000" y="862" width="346" height="88" rx="8" class="data"/>
  <text x="1024" y="896" class="heading">本地诊断报告</text>
  <text x="1024" y="922" class="body">无需协查，或审批被拒绝 / 已过期</text>
  <path d="M 1238 800 V 856" class="edge"/>
  <text x="1252" y="828" class="small">否</text>

  <rect x="110" y="978" width="640" height="52" rx="8" class="box"/>
  <text x="134" y="1010" class="heading-compact">持久化并回复：LibSQL · 脱敏 SSE / IM</text>
  <path d="M 430 950 V 972" class="edge"/>
  <rect x="1000" y="978" width="346" height="52" rx="8" class="box"/>
  <text x="1024" y="1010" class="heading-compact">持久化并回复</text>
  <path d="M 1173 950 V 972" class="edge"/>

  <text x="54" y="1090" class="small">当前边界：真实 Catalog 字段与真实学员链路未验收；自动换绑、多仓库原子快照和多进程 lease/CAS 尚未实现。</text>
</svg>

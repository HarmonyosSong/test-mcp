<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" role="img" aria-labelledby="title description">
  <title id="title">Troubleshoot Odyssey 当前诊断主流程</title>
  <desc id="description">请求经准入后进入唯一诊断路径 runDiagnosisRound 单 loop：模型自主决定排查路径，按需调用知识、日志、源码与协查工具；RoundGuard 提供横切护栏，观测注册表记录证据，最终回答经校验器校验后按渠道输出——Web 完整结论，知音楼固定模板。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/>
    </marker>
    <marker id="arrow-external" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16816f"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #26364b; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5f6f84; }
      .section { font-size: 13px; font-weight: 700; fill: #62738a; }
      .heading { font-size: 18px; font-weight: 700; }
      .heading-compact { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; fill: #506177; }
      .small { font-size: 12px; fill: #65758a; }
      .frame { fill: #fbfcfe; stroke: #dce3eb; stroke-width: 1.5; }
      .client-frame { fill: #f5f8fc; stroke: #a9bdd6; stroke-width: 1.5; }
      .server-frame { fill: #f4fbf9; stroke: #9dc8bd; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #b8c5d3; stroke-width: 1.5; }
      .runtime { fill: #eef3fb; stroke: #91a8c7; stroke-width: 1.7; }
      .navigation { fill: #f1efff; stroke: #a99be0; stroke-width: 1.7; }
      .data { fill: #f1f6ed; stroke: #a5bc89; stroke-width: 1.7; }
      .boundary { fill: #fffaf0; stroke: #d99a3c; stroke-width: 1.7; stroke-dasharray: 7 5; }
      .external { fill: #eef7f6; stroke: #83b9ad; stroke-width: 1.7; }
      .edge { fill: none; stroke: #718299; stroke-width: 2; marker-end: url(#arrow); }
      .edge-external { fill: none; stroke: #16816f; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-external); }
      .edge-label { font-size: 12px; font-weight: 700; fill: #527066; }
    </style>
  </defs>

  <rect width="1400" height="1120" fill="#ffffff"/>
  <text x="54" y="54" class="title">当前一轮诊断：单 loop 自主排查，工具与护栏由代码承载</text>
  <text x="54" y="84" class="subtitle">模型自主决定排查路径；Runtime 只做准入、工具封装、横切护栏与最终校验——无 Supervisor、无阶段状态机</text>
  <text x="54" y="110" class="small">实线为本地主流程，绿色虚线为 consult_compass 协查；完成态协查结论登记为正式观测，与本地证据同级。</text>

  <rect x="54" y="132" width="1292" height="140" rx="12" class="frame"/>
  <text x="78" y="160" class="section">01 · 接入与唯一诊断路径</text>
  <rect x="82" y="182" width="220" height="64" rx="8" class="box"/>
  <text x="102" y="209" class="heading">用户问题</text>
  <text x="102" y="232" class="body">Web / 知音楼 IM</text>
  <rect x="380" y="182" width="300" height="64" rx="8" class="runtime"/>
  <text x="400" y="209" class="heading">Hono + RunAdmission</text>
  <text x="400" y="232" class="body">身份校验 · 会话互斥 · 全局并发</text>
  <rect x="780" y="164" width="520" height="96" rx="8" class="runtime"/>
  <text x="804" y="194" class="heading">runDiagnosisRound（单 loop）</text>
  <text x="804" y="218" class="body">轮首最佳努力预绑源码；歧义/缺口转为 limitations 文本</text>
  <text x="804" y="240" class="small">模型自主规划后续路径，代码层不再做技术路由</text>
  <path d="M 302 214 H 380" class="edge"/>
  <path d="M 680 214 H 780" class="edge"/>

  <rect x="54" y="300" width="1292" height="360" rx="12" class="client-frame"/>
  <text x="78" y="330" class="section">02 · 单 loop 内：模型自主规划，工具按需提供</text>

  <rect x="82" y="382" width="220" height="186" rx="8" class="runtime"/>
  <text x="102" y="416" class="heading-compact">DiagnosisAgent</text>
  <text x="102" y="448" class="body">自主决定排查路径与顺序</text>
  <text x="102" y="472" class="body">技能正文承载流程指引</text>
  <text x="102" y="500" class="small">知识 / 目录 / 导航只是线索</text>
  <text x="102" y="524" class="small">观测与协查结论才是证据</text>

  <rect x="340" y="382" width="560" height="186" rx="8" class="box"/>
  <text x="364" y="414" class="heading">模型可见工具</text>
  <text x="364" y="446" class="body">线索：load_skill · lookup_issue · search_code_index 目录</text>
  <text x="364" y="472" class="body">取证：日志工具 · prepare_source · 源码懒代理工具组</text>
  <text x="364" y="500" class="body">协查：consult_compass（预算 4 次/轮）</text>
  <text x="364" y="530" class="small">学员身份由 Runtime 私有注入日志工具，不进模型 schema</text>
  <text x="364" y="552" class="small">源码工具未绑定时返回提示，prepare_source 轮内热绑定</text>

  <rect x="940" y="382" width="406" height="186" rx="8" class="data"/>
  <text x="964" y="414" class="heading">横切护栏与证据</text>
  <text x="964" y="446" class="body">RoundGuard：串行 dispatch · 结果缓存</text>
  <text x="964" y="470" class="body">同签名失败禁重试 · 无进展只注入提醒</text>
  <text x="964" y="494" class="body">软时限 900s 关工具 + 180s 收尾窗硬 abort</text>
  <text x="964" y="524" class="small">ObservationRegistry：append-only ev-ID 元数据</text>
  <text x="964" y="546" class="small">source / log / external 三类观测共存</text>

  <path d="M 302 475 H 340" class="edge"/>
  <path d="M 900 475 H 940" class="edge"/>

  <rect x="82" y="596" width="1264" height="42" rx="8" class="boundary"/>
  <text x="102" y="622" class="small">prepare_source 供应链：version-registry → GitLab archive → 组件物化（iOS Podfile.lock · 安卓钉版本 + per-module tag）→ 多仓组合只读快照；对照端双槽位（target=compare）。</text>

  <rect x="54" y="690" width="1292" height="364" rx="12" class="server-frame"/>
  <text x="78" y="720" class="section">03 · 校验、判定与渠道输出</text>

  <rect x="82" y="752" width="300" height="120" rx="8" class="data"/>
  <text x="102" y="786" class="heading-compact">FinalAnswerValidator</text>
  <text x="102" y="812" class="body">非空 · 无协议泄露</text>
  <text x="102" y="834" class="body">ev-ID 存在性 · 判定锚点</text>
  <text x="102" y="858" class="small">打回重试 ≤2 次，仍缺锚点放行记 null</text>

  <rect x="430" y="752" width="250" height="120" rx="8" class="box"/>
  <text x="454" y="786" class="heading-compact">判定锚点解析</text>
  <text x="454" y="812" class="body">已定位 / 可能定位</text>
  <text x="454" y="834" class="body">证据不足 / 工具异常</text>
  <text x="454" y="858" class="small">写入 diagnosis_outcome 日志</text>

  <rect x="730" y="752" width="280" height="120" rx="8" class="box"/>
  <text x="754" y="786" class="heading-compact">Web 工作台</text>
  <text x="754" y="812" class="body">完整结论与依据</text>
  <text x="754" y="834" class="small">ev-ID 可回溯到观测原文</text>

  <rect x="1060" y="752" width="286" height="120" rx="8" class="box"/>
  <text x="1084" y="786" class="heading-compact">知音楼 IM</text>
  <text x="1084" y="812" class="body">固定模板：加粗归属指引</text>
  <text x="1084" y="834" class="body">分点原因 · 动态补充信息</text>
  <text x="1084" y="858" class="small">长推理与内部标识不入 IM</text>

  <path d="M 382 812 H 430" class="edge"/>
  <path d="M 680 800 H 730" class="edge"/>
  <path d="M 680 832 H 1060" class="edge"/>

  <rect x="430" y="932" width="916" height="64" rx="8" class="box"/>
  <text x="454" y="958" class="heading-compact">持久化并回复：LibSQL · SSE</text>
  <text x="454" y="980" class="small">工具终态与观测快照先持久化再发送；completed/failed 在流结束前保存</text>
  <path d="M 870 872 V 926" class="edge"/>
  <path d="M 1203 872 V 926" class="edge"/>

  <text x="54" y="1090" class="small">当前边界：单进程部署（多进程 lease/CAS 未实现）；LogCenter 真实生产字段与真实学员链路仍待验收；版本登记、组件快照与 code-index 随镜像发布。</text>
</svg>

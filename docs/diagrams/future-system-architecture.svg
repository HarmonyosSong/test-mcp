<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1180" role="img" aria-labelledby="title description">
  <title id="title">Troubleshoot Odyssey 未来系统架构</title>
  <desc id="description">分层展示 Web 与知音楼 IM 入口、Hono 与渠道适配、Mastra 诊断核心、本地 MCP 与存储能力，以及 SSO、模型服务商和云学习服务端 Agent 的系统边界。A2A 外部结论单独保存，不进入本地证据账本。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-planned" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c47a19"/>
    </marker>
    <marker id="arrow-external" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#13866f"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24324a; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #65738b; }
      .boundary-title { font-size: 19px; font-weight: 700; }
      .layer-title { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #68768d; }
      .card-title { font-size: 18px; font-weight: 700; }
      .card-sub { font-size: 14px; fill: #5d6b82; }
      .small { font-size: 12px; fill: #69778e; }
      .edge-label { font-size: 12px; font-weight: 600; fill: #56657d; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .card-core { fill: #f1efff; stroke: #c9bdf3; stroke-width: 1.5; }
      .card-data { fill: #edf7f4; stroke: #a9d5c9; stroke-width: 1.5; }
      .card-planned { fill: #fff8eb; stroke: #e4bb78; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .card-external { fill: #f2f7fc; stroke: #aebed4; stroke-width: 1.5; }
      .layer { fill: #fbfcfe; stroke: #e2e8f0; stroke-width: 1; }
      .edge { fill: none; stroke: #77859a; stroke-width: 2; marker-end: url(#arrow); }
      .edge-both { fill: none; stroke: #77859a; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .edge-planned { fill: none; stroke: #c47a19; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-planned); }
      .edge-external { fill: none; stroke: #13866f; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-external); }
      .pill { fill: #e7f4ef; stroke: #a9d5c9; }
      .pill-planned { fill: #fff2d8; stroke: #e4bb78; }
      .pill-text { font-size: 11px; font-weight: 700; fill: #247d69; }
      .pill-planned-text { font-size: 11px; font-weight: 700; fill: #986016; }
    </style>
  </defs>

  <rect width="1680" height="1180" fill="#f4f7fb"/>
  <rect x="42" y="34" width="6" height="50" rx="3" fill="#6d59c7"/>
  <text class="title" x="68" y="68">Troubleshoot Odyssey 系统架构</text>
  <text class="subtitle" x="70" y="101">客户端诊断与云学习服务端 Agent 协作 · 目标形态</text>

  <g transform="translate(1100 42)">
    <rect x="0" y="0" width="150" height="32" rx="16" class="pill"/>
    <text class="pill-text" x="75" y="21" text-anchor="middle">现有能力</text>
    <rect x="165" y="0" width="150" height="32" rx="16" class="pill-planned"/>
    <text class="pill-planned-text" x="240" y="21" text-anchor="middle">规划能力</text>
    <line x1="338" y1="16" x2="390" y2="16" class="edge"/>
    <text class="small" x="400" y="21">依赖 / 调用</text>
  </g>

  <!-- System boundaries -->
  <rect x="38" y="135" width="1188" height="1000" rx="16" fill="#ffffff" stroke="#9eabc0" stroke-width="2"/>
  <text class="boundary-title" x="64" y="170">客户端诊断系统</text>
  <text class="small" x="1200" y="169" text-anchor="end">Web 与 IM 共用诊断核心</text>

  <rect x="1250" y="135" width="392" height="1000" rx="16" fill="#f9fbfd" stroke="#9eabc0" stroke-width="2"/>
  <text class="boundary-title" x="1276" y="170">外部系统边界</text>

  <!-- Architectural layers -->
  <rect class="layer" x="58" y="190" width="1148" height="132" rx="10"/>
  <text class="layer-title" x="76" y="215">01 · 接入层</text>
  <rect class="layer" x="58" y="334" width="1148" height="150" rx="10"/>
  <text class="layer-title" x="76" y="359">02 · 协议与渠道适配层</text>
  <rect class="layer" x="58" y="496" width="1148" height="298" rx="10"/>
  <text class="layer-title" x="76" y="521">03 · MASTRA 诊断与运行时层</text>
  <rect class="layer" x="58" y="806" width="1148" height="180" rx="10"/>
  <text class="layer-title" x="76" y="831">04 · 数据、知识与取证能力层</text>
  <rect class="layer" x="58" y="998" width="1148" height="116" rx="10"/>
  <text class="layer-title" x="76" y="1023">05 · 持久化与配置</text>

  <!-- Entry layer -->
  <rect class="card" x="100" y="232" width="430" height="70" rx="9"/>
  <text class="card-title" x="124" y="262">React / Vite Web 工作台</text>
  <text class="card-sub" x="124" y="285">诊断会话 · REST · AG-UI SSE</text>
  <rect class="pill" x="444" y="248" width="68" height="24" rx="12"/>
  <text class="pill-text" x="478" y="264" text-anchor="middle">现有</text>

  <rect class="card" x="620" y="232" width="430" height="70" rx="9"/>
  <text class="card-title" x="644" y="262">知音楼 IM 平台</text>
  <text class="card-sub" x="644" y="285">数字伙伴 · 私聊消息入口</text>
  <rect class="pill" x="964" y="248" width="68" height="24" rx="12"/>
  <text class="pill-text" x="998" y="264" text-anchor="middle">现有</text>

  <!-- Adapter layer -->
  <rect class="card" x="100" y="374" width="500" height="88" rx="9"/>
  <text class="card-title" x="124" y="405">Hono 产品服务</text>
  <text class="card-sub" x="124" y="430">SSO middleware · REST API · SSE · 静态资源</text>
  <rect class="pill" x="514" y="390" width="68" height="24" rx="12"/>
  <text class="pill-text" x="548" y="406" text-anchor="middle">现有</text>

  <rect class="card" x="660" y="374" width="390" height="88" rx="9"/>
  <text class="card-title" x="684" y="405">YachChannel</text>
  <text class="card-sub" x="684" y="430">Bridge 收信 · OAPI 回复 · 进度卡片</text>
  <rect class="pill" x="964" y="390" width="68" height="24" rx="12"/>
  <text class="pill-text" x="998" y="406" text-anchor="middle">现有</text>

  <!-- Core layer -->
  <rect class="card" x="92" y="550" width="216" height="112" rx="9"/>
  <text class="card-title" x="112" y="582">runDiagnosisRound</text>
  <text class="card-sub" x="112" y="608">Web / IM 共用诊断轮</text>
  <text class="small" x="112" y="635">准入 · 生命周期 · 终态持久化</text>

  <rect class="card-core" x="334" y="550" width="264" height="112" rx="9"/>
  <text class="card-title" x="356" y="582">DiagnosisAgent</text>
  <text class="card-sub" x="356" y="608">Mastra Agent · 多轮对话</text>
  <text class="small" x="356" y="635">模型编排 · 流式事件</text>

  <rect class="card" x="626" y="550" width="224" height="112" rx="9"/>
  <text class="card-title" x="648" y="582">CapabilityMcp</text>
  <text class="card-sub" x="648" y="608">能力创建与 MCP 生命周期</text>
  <text class="small" x="648" y="635">预算 · 超时 · Abort</text>

  <rect class="card" x="878" y="550" width="276" height="112" rx="9"/>
  <text class="card-title" x="900" y="582">EvidenceLedger</text>
  <text class="card-sub" x="900" y="608">用户输入 · 本地工具实际观测</text>
  <text class="small" x="900" y="635">仅本地证据支撑根因候选</text>

  <rect class="card" x="334" y="686" width="264" height="76" rx="9"/>
  <text class="card-title" x="356" y="716">SkillRegistry</text>
  <text class="card-sub" x="356" y="741">声明式 Markdown Skills</text>

  <rect class="card" x="626" y="686" width="224" height="76" rx="9"/>
  <text class="card-title" x="648" y="716">ModelConfiguration</text>
  <text class="card-sub" x="648" y="741">Provider · Model · Key</text>

  <rect class="card-planned" x="878" y="686" width="276" height="76" rx="9"/>
  <text class="card-title" x="900" y="714">ExternalFindings</text>
  <text class="card-sub" x="900" y="738">服务端结论 · 综合判断 · 责任状态</text>
  <text class="small" x="900" y="756">与 EvidenceLedger 分开保存</text>

  <!-- Core dependency lines -->
  <path class="edge" d="M 350 462 V 522 H 200 V 544"/>
  <path class="edge" d="M 855 462 V 522 H 200"/>
  <path class="edge" d="M 308 606 H 328"/>
  <path class="edge" d="M 598 606 H 620"/>
  <path class="edge-both" d="M 598 632 H 870"/>
  <path class="edge" d="M 466 662 V 680"/>
  <path class="edge" d="M 758 662 V 680"/>

  <!-- Capability layer -->
  <rect class="card-data" x="82" y="854" width="250" height="104" rx="9"/>
  <text class="card-title" x="104" y="886">本地 Knowledge MCP</text>
  <text class="card-sub" x="104" y="912">knowledge/ · 客户端知识</text>
  <text class="small" x="104" y="938">端信息只作排序上下文</text>
  <rect class="pill" x="254" y="866" width="66" height="22" rx="11"/>
  <text class="pill-text" x="287" y="881" text-anchor="middle">现有</text>

  <rect class="card-data" x="352" y="854" width="270" height="104" rx="9"/>
  <text class="card-title" x="374" y="886">Repository + MCP</text>
  <text class="card-sub" x="374" y="912">Git mirror · 固定 Commit 快照</text>
  <text class="small" x="374" y="938">Harmony 现有 · Android/iOS 规划</text>

  <rect class="card-planned" x="642" y="854" width="238" height="104" rx="9"/>
  <text class="card-title" x="664" y="886">LogCenter MCP</text>
  <text class="card-sub" x="664" y="912">服务端日志 · MCP 内脱敏</text>
  <text class="small" x="664" y="938">关联门禁 · observation_context</text>
  <rect class="pill-planned" x="794" y="866" width="72" height="22" rx="11"/>
  <text class="pill-planned-text" x="830" y="881" text-anchor="middle">规划中</text>

  <rect class="card" x="900" y="854" width="254" height="104" rx="9"/>
  <text class="card-title" x="922" y="886">Compass A2A Client</text>
  <text class="card-sub" x="922" y="912">P0 客户端已实现</text>
  <text class="small" x="922" y="938">聊天门控与外发约束：P1</text>
  <rect class="pill-planned" x="1068" y="866" width="72" height="22" rx="11"/>
  <text class="pill-planned-text" x="1104" y="881" text-anchor="middle">P1 规划</text>

  <!-- Capability connectors -->
  <path class="edge" d="M 738 762 V 808 H 207 V 848"/>
  <path class="edge" d="M 738 808 H 487 V 848"/>
  <path class="edge-planned" d="M 738 808 H 761 V 848"/>
  <path class="edge-planned" d="M 738 808 H 1027 V 848"/>
  <path class="edge" d="M 487 850 V 838 H 1166 V 640 H 1160"/>
  <text class="edge-label" x="1000" y="833" text-anchor="middle">source 观测</text>
  <path class="edge-planned" d="M 761 848 V 776 H 860 V 668 H 900 V 662"/>

  <!-- Persistence layer -->
  <rect class="card" x="92" y="1044" width="500" height="52" rx="8"/>
  <text class="card-title" x="114" y="1066">LibSQL / ProductStore</text>
  <text class="card-sub" x="114" y="1087">Mastra storage · 会话 · 快照 · 本地证据与外部结论分栏</text>

  <rect class="card" x="626" y="1044" width="244" height="52" rx="8"/>
  <text class="card-title" x="648" y="1077">model-config.json</text>
  <text class="small" x="850" y="1077" text-anchor="end">owner-only</text>

  <rect class="card" x="904" y="1044" width="250" height="52" rx="8"/>
  <text class="card-title" x="926" y="1077">Skills · 查询日志 · 案例</text>

  <path class="edge" d="M 200 662 V 1038"/>
  <path class="edge" d="M 738 762 V 1038"/>
  <path class="edge" d="M 466 762 V 1038"/>

  <!-- External systems -->
  <rect class="card-external" x="1280" y="374" width="332" height="88" rx="9"/>
  <text class="card-title" x="1304" y="405">知音楼 SSO 服务</text>
  <text class="card-sub" x="1304" y="430">登录 · Ticket 验证 · 退出</text>
  <path class="edge" d="M 600 438 V 476 H 1238 V 418 H 1272"/>
  <text class="edge-label" x="930" y="471" text-anchor="middle">SSO / Ticket</text>

  <rect class="card-external" x="1280" y="686" width="332" height="76" rx="9"/>
  <text class="card-title" x="1304" y="717">模型服务商</text>
  <text class="card-sub" x="1304" y="741">DeepSeek 正式 · 其他 Provider 实验</text>
  <path class="edge" d="M 850 724 V 674 H 1238 V 724 H 1272"/>

  <rect class="card-external" x="1280" y="854" width="332" height="104" rx="9"/>
  <text class="card-title" x="1304" y="886">云学习服务端 Agent</text>
  <text class="card-sub" x="1304" y="912">服务端编排 · 自行检索云学习知识</text>
  <text class="small" x="1304" y="938">Compass A2A 对端</text>

  <rect class="card-external" x="1280" y="982" width="332" height="76" rx="9"/>
  <text class="card-title" x="1304" y="1013">云学习服务端知识库</text>
  <text class="card-sub" x="1304" y="1037">由服务端 Agent 独立维护和使用</text>
  <path class="edge" d="M 1446 958 V 976"/>

  <path class="edge-planned" d="M 1154 906 H 1272 V 906 H 1274"/>
  <path class="edge-external" d="M 1280 930 H 1152"/>
  <text class="edge-label" x="1220" y="918" text-anchor="middle" fill="#13866f">外部结论返回</text>
  <path class="edge-external" d="M 1148 854 V 782 H 1040 V 762"/>

  <text class="small" x="64" y="1160">实线：当前依赖或调用　·　橙色虚线：规划中的客户端接入　·　绿色虚线：外部 Agent 结论，单独保存且不进入 evidence_refs</text>
</svg>

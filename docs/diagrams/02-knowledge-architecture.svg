<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" role="img" aria-labelledby="title description">
  <title id="title">Troubleshoot Odyssey 知识与代码图谱架构</title>
  <desc id="description">区分本地规范知识检索、Graphify 代码知识图谱查询和云学习服务端知识，展示知识线索如何回到源码证据。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16816f"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #26364b; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5f6f84; }
      .section { font-size: 13px; font-weight: 700; fill: #62738a; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 13px; fill: #506177; }
      .small { font-size: 12px; fill: #65758a; }
      .frame { fill: #fbfcfe; stroke: #dce3eb; stroke-width: 1.5; }
      .external-frame { fill: #f7fbfa; stroke: #9dc8bd; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #b8c5d3; stroke-width: 1.5; }
      .knowledge { fill: #fff4e7; stroke: #dfb16b; stroke-width: 1.7; }
      .graph { fill: #f1efff; stroke: #a99be0; stroke-width: 1.7; }
      .data { fill: #f1f6ed; stroke: #a5bc89; stroke-width: 1.7; }
      .planned { fill: #fffaf0; stroke: #d99a3c; stroke-width: 1.7; stroke-dasharray: 7 5; }
      .external { fill: #eef7f6; stroke: #83b9ad; stroke-width: 1.7; }
      .edge { fill: none; stroke: #718299; stroke-width: 2; marker-end: url(#arrow); }
      .edge-green { fill: none; stroke: #16816f; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-green); }
      .edge-label { font-size: 12px; font-weight: 600; fill: #56657d; }
      .pill { fill: #e7f3ed; stroke: #a7cdb7; }
      .pill-plan { fill: #fff7e9; stroke: #dfb16b; }
      .pill-text { font-size: 11px; font-weight: 700; fill: #286b4d; }
      .pill-plan-text { font-size: 11px; font-weight: 700; fill: #9b6315; }
    </style>
  </defs>

  <rect width="1400" height="1060" fill="#ffffff"/>
  <text x="54" y="56" class="title">Troubleshoot Odyssey | 知识与代码图谱</text>
  <text x="54" y="84" class="subtitle">规范知识负责缩小候选；代码知识图谱负责导航；源码回读才形成现场证据</text>

  <rect x="54" y="120" width="1292" height="250" rx="12" class="frame"/>
  <text x="78" y="150" class="section">01 · 本地规范知识检索 · Knowledge MCP</text>
  <rect x="82" y="198" width="216" height="84" rx="8" class="box"/>
  <text x="102" y="232" class="heading">用户问题</text>
  <text x="102" y="257" class="body">现象、业务词、端和版本</text>
  <rect x="338" y="198" width="236" height="84" rx="8" class="knowledge"/>
  <text x="358" y="232" class="heading">Knowledge MCP</text>
  <text x="358" y="257" class="body">lookup_issue · search_knowledge</text>
  <rect x="614" y="198" width="236" height="84" rx="8" class="knowledge"/>
  <text x="634" y="232" class="heading">候选与判据</text>
  <text x="634" y="257" class="body">symptoms · facts · cross_refs</text>
  <rect x="890" y="198" width="236" height="84" rx="8" class="knowledge"/>
  <text x="910" y="232" class="heading">get_knowledge_entry</text>
  <text x="910" y="257" class="body">分页读取完整知识正文</text>
  <rect x="1166" y="198" width="154" height="84" rx="8" class="data"/>
  <text x="1186" y="232" class="heading">排序上下文</text>
  <text x="1186" y="257" class="body">域 · 端 · 版本</text>
  <path d="M 298 240 H 338" class="edge"/>
  <path d="M 574 240 H 614" class="edge"/>
  <path d="M 850 240 H 890" class="edge"/>
  <path d="M 1126 240 H 1166" class="edge"/>
  <text x="78" y="329" class="small">知识条目是候选线索，不是当前故障的证明；业务域和端适用性只参与排序，不作硬过滤。</text>

  <rect x="54" y="404" width="1292" height="300" rx="12" class="frame"/>
  <text x="78" y="434" class="section">02 · 代码知识图谱查询 · Graphify / code_graph</text>
  <rect x="82" y="486" width="218" height="96" rx="8" class="box"/>
  <text x="102" y="520" class="heading">绑定代码快照</text>
  <text x="102" y="545" class="body">仓库 · commit · tree hash</text>
  <text x="102" y="565" class="small">runtime 选择，模型不能指定路径</text>
  <rect x="340" y="486" width="236" height="96" rx="8" class="graph"/>
  <text x="360" y="520" class="heading">Graphify 产物</text>
  <text x="360" y="545" class="body">graph.json · 节点 · 边 · provenance</text>
  <text x="360" y="565" class="small">离线生成，只读加载</text>
  <rect x="616" y="486" width="236" height="96" rx="8" class="graph"/>
  <text x="636" y="520" class="heading">code_graph.search</text>
  <text x="636" y="545" class="body">组件 · 方法 · 文件 · 符号</text>
  <text x="636" y="565" class="small">按真实图词表召回</text>
  <rect x="892" y="486" width="236" height="96" rx="8" class="graph"/>
  <text x="912" y="520" class="heading">code_graph.expand</text>
  <text x="912" y="545" class="body">一跳关系 · 最多两跳</text>
  <text x="912" y="565" class="small">EXTRACTED / INFERRED</text>
  <rect x="1168" y="486" width="152" height="96" rx="8" class="planned"/>
  <text x="1188" y="520" class="heading">导航结果</text>
  <text x="1188" y="545" class="body">节点与边</text>
  <text x="1188" y="565" class="small">不是证据</text>
  <path d="M 300 534 H 340" class="edge"/>
  <path d="M 576 534 H 616" class="edge"/>
  <path d="M 852 534 H 892" class="edge"/>
  <path d="M 1128 534 H 1168" class="edge"/>

  <rect x="604" y="618" width="236" height="58" rx="8" class="box"/>
  <text x="624" y="653" class="heading">read_project_file</text>
  <rect x="880" y="618" width="236" height="58" rx="8" class="data"/>
  <text x="900" y="653" class="heading">真实源码观测</text>
  <rect x="1156" y="618" width="164" height="58" rx="8" class="data"/>
  <text x="1176" y="653" class="heading">EvidenceLedger</text>
  <path d="M 1244 582 V 600 H 722 V 618" class="edge"/>
  <path d="M 840 647 H 880" class="edge"/>
  <path d="M 1116 647 H 1156" class="edge"/>
  <text x="78" y="687" class="small">Graphify 是代码知识图谱导航，不等同于规范知识库；图中没有边也不能证明源码中不存在调用。</text>

  <rect x="54" y="738" width="1292" height="196" rx="12" class="external-frame"/>
  <text x="78" y="768" class="section">03 · 远端 Agent 知识归属 · A2A 插槽</text>
  <rect x="94" y="812" width="300" height="72" rx="8" class="external"/>
  <text x="118" y="844" class="heading">A2A Agent Slot</text>
  <text x="118" y="868" class="body">只传授权范围内的脱敏上下文</text>
  <rect x="470" y="812" width="330" height="72" rx="8" class="external"/>
  <text x="494" y="844" class="heading">远端 Agent</text>
  <text x="494" y="868" class="body">自主查询服务端知识、代码和日志</text>
  <rect x="876" y="812" width="400" height="72" rx="8" class="external"/>
  <text x="900" y="844" class="heading">远端 Agent 知识库</text>
  <text x="900" y="868" class="body">由远端 Agent 所有；返回 external_findings</text>
  <path d="M 394 848 H 470" class="edge-green"/>
  <path d="M 800 848 H 876" class="edge-green"/>
  <text x="78" y="916" class="small">客户端不直连云学习 Knowledge MCP，也不把 A2A 返回写入本地 evidence_refs；它作为有来源的外部结论展示。</text>
</svg>

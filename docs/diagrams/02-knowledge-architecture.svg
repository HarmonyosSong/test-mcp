<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" role="img" aria-labelledby="title description">
  <title id="title">业务知识、动态源码与外部 Agent 的整体架构</title>
  <desc id="description">人工筛选的业务知识进入本地 Knowledge MCP，用户问题进入 Mastra Runtime。Runtime 通过 UCenter 将学员编号转换为 UID 后查询 LogCenter，依据提示词和日志事实动态绑定平台、产品线、版本与固定源码快照，再通过 Repository MCP 取证；统一前端、H5 和服务端 Agent 通过 Agent Slot 和 A2A 接入，远端结论与本地 EvidenceLedger 分开保存，最后生成联合报告。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43805c"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16816f"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #27364a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #58697e; }
      .eyebrow { font-size: 13px; font-weight: 700; fill: #66768b; }
      .heading { font-size: 19px; font-weight: 700; }
      .heading-small { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #4c5d72; }
      .small { font-size: 12px; fill: #617187; }
      .tiny { font-size: 11px; fill: #65758a; }
      .frame { fill: #f9fbfd; stroke: #d9e1e9; stroke-width: 1.5; }
      .runtime-frame { fill: #f1f5fb; stroke: #9db1ce; stroke-width: 1.7; }
      .knowledge { fill: #fff5e8; stroke: #d9a85e; stroke-width: 1.7; }
      .observability { fill: #eef7f6; stroke: #83b9ad; stroke-width: 1.7; }
      .code { fill: #eaf5f3; stroke: #75aaa1; stroke-width: 1.7; }
      .external { fill: #f2effc; stroke: #a69bd3; stroke-width: 1.7; }
      .source { fill: #eef5eb; stroke: #9eb78b; stroke-width: 1.7; }
      .ledger { fill: #eaf4ed; stroke: #72a17f; stroke-width: 1.8; }
      .white { fill: #fff; stroke: #d7dfe8; stroke-width: 1.3; }
      .mini { fill: #fff; stroke: #c3d0e0; stroke-width: 1.2; }
      .route { fill: none; stroke: #74849a; stroke-width: 2.1; marker-end: url(#arrow); }
      .route-dashed { fill: none; stroke: #74849a; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #74849a; stroke-width: 2.1; }
      .evidence-route { fill: none; stroke: #43805c; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .external-route { fill: none; stroke: #16816f; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-teal); }
      .route-label { font-size: 12px; font-weight: 600; fill: #58697e; }
      .tag { fill: #e6f1e8; stroke: #abc9b0; }
      .tag-text { font-size: 11px; font-weight: 700; fill: #356c48; }
      .tag-outline { fill: #fff7e9; stroke: #dfbd7d; }
      .tag-outline-text { font-size: 11px; font-weight: 700; fill: #90621c; }
    </style>
  </defs>

  <rect width="1600" height="1360" fill="#fff"/>
  <text x="64" y="62" class="title">业务知识、动态源码与外部 Agent 的整体架构</text>
  <text x="64" y="93" class="subtitle">Knowledge MCP 负责业务索引，Runtime 负责动态绑定与取证，A2A 负责统一前端 / H5 / 服务端协查</text>
  <g transform="translate(1250 42)">
    <rect width="112" height="28" rx="6" class="tag"/>
    <text x="56" y="19" text-anchor="middle" class="tag-text">架构已接入</text>
    <rect x="124" width="162" height="28" rx="6" class="tag-outline"/>
    <text x="205" y="19" text-anchor="middle" class="tag-outline-text">生产字段持续验收</text>
  </g>

  <rect x="48" y="130" width="1504" height="1200" rx="10" class="frame"/>

  <text x="80" y="170" class="eyebrow">01  内容策展与知识边界</text>
  <rect x="80" y="198" width="300" height="128" rx="8" class="white"/>
  <text x="104" y="232" class="heading">PRD / 工单 / 需求文档</text>
  <text x="104" y="264" class="body">知音楼原文与业务输入</text>
  <text x="104" y="290" class="small">原文留在业务系统，由人核验</text>

  <rect x="430" y="198" width="400" height="128" rx="8" class="knowledge"/>
  <text x="454" y="232" class="heading">人工筛选三道门</text>
  <text x="454" y="262" class="body">索引价值 · C 端可感知 · 模型答错风险</text>
  <text x="454" y="290" class="small">不满足任一条件，不蒸馏进知识库</text>

  <rect x="880" y="184" width="620" height="156" rx="8" class="knowledge"/>
  <text x="908" y="220" class="heading">Markdown Knowledge Base</text>
  <text x="908" y="250" class="body">facts / symptoms / references · 一个事实一个规范入口</text>
  <text x="908" y="278" class="body">用户语言 → 业务场景 → 候选链路 / 代码锚点</text>
  <text x="908" y="307" class="small">业务域、适用端、版本只参与排序；跨域引用与全局回退保留</text>
  <rect x="1260" y="302" width="206" height="24" rx="5" class="tag-outline"/>
  <text x="1363" y="318" text-anchor="middle" class="tag-outline-text">索引，不是代码副本</text>

  <path d="M 380 262 H 430" class="route"/>
  <path d="M 830 262 H 880" class="route"/>

  <text x="80" y="410" class="eyebrow">02  Runtime 统一入口与动态决策</text>
  <rect x="80" y="442" width="210" height="118" rx="8" class="white"/>
  <text x="104" y="478" class="heading">用户问题</text>
  <text x="104" y="508" class="body">业务现象 / 接口 / 日志</text>
  <text x="104" y="534" class="small">可带学员编号或版本提示</text>

  <rect x="350" y="430" width="1150" height="190" rx="10" class="runtime-frame"/>
  <text x="380" y="468" class="heading">Mastra Runtime · ClientDiagnosisAgent</text>
  <text x="380" y="496" class="body">统一客户端 Agent：HarmonyOS / Android / iOS 共用一套诊断入口</text>
  <rect x="380" y="525" width="250" height="64" rx="7" class="mini"/>
  <text x="400" y="551" class="heading-small">问题分类与 Skill</text>
  <text x="400" y="574" class="small">业务索引 / 现场观察 / 源码取证</text>
  <rect x="660" y="525" width="250" height="64" rx="7" class="mini"/>
  <text x="680" y="551" class="heading-small">能力会话与预算</text>
  <text x="680" y="574" class="small">按轮挂载、缓存、取消、限额</text>
  <rect x="940" y="525" width="250" height="64" rx="7" class="mini"/>
  <text x="960" y="551" class="heading-small">动态上下文</text>
  <text x="960" y="574" class="small">提示词 + LogCenter 事实绑定版本</text>
  <rect x="1220" y="525" width="250" height="64" rx="7" class="mini"/>
  <text x="1240" y="551" class="heading-small">observe → source</text>
  <text x="1240" y="574" class="small">报告校验与证据引用门禁</text>
  <path d="M 290 501 H 350" class="route"/>

  <text x="80" y="680" class="eyebrow">03  能力层：按问题动态组合，不复制第二套知识库</text>
  <path d="M 925 620 V 700 H 245" class="bus"/>
  <path d="M 245 700 H 1345" class="bus"/>
  <path d="M 615 700 V 770" class="route"/>
  <path d="M 985 700 V 770" class="route"/>
  <path d="M 1345 700 V 770" class="route"/>
  <path d="M 245 700 V 770" class="route"/>

  <rect x="80" y="770" width="330" height="270" rx="8" class="knowledge"/>
  <text x="106" y="810" class="heading">Knowledge MCP</text>
  <text x="106" y="840" class="body">业务索引，不存全量代码</text>
  <text x="106" y="858" class="small">来源：上方人工筛选的 Markdown 条目</text>
  <text x="106" y="884" class="heading-small">lookup_issue</text>
  <text x="106" y="910" class="body">候选事实 · 引用 · 区分判据</text>
  <text x="106" y="940" class="small">支持用户术语与代码术语的映射</text>
  <text x="106" y="966" class="small">端 / 域 / 版本用于排序，不作硬过滤</text>
  <rect x="106" y="982" width="232" height="30" rx="6" class="tag-outline"/>
  <text x="222" y="1002" text-anchor="middle" class="tag-outline-text">命中知识 ≠ 已验证证据</text>

  <rect x="450" y="770" width="330" height="270" rx="8" class="observability"/>
  <text x="476" y="810" class="heading">身份与现场事实</text>
  <text x="476" y="842" class="body">学员编号 → UCenter → UID</text>
  <text x="476" y="874" class="body">UID → LogCenter 查询</text>
  <text x="476" y="908" class="small">匹配事实：平台 · 产品线 · 形态 · 版本</text>
  <text x="476" y="936" class="small">trace / request / 时间窗用于日志关联</text>
  <text x="476" y="970" class="small">事实可补齐源码绑定上下文</text>
  <rect x="476" y="986" width="232" height="30" rx="6" class="tag"/>
  <text x="592" y="1006" text-anchor="middle" class="tag-text">先身份关联，再记日志证据</text>

  <rect x="820" y="770" width="330" height="270" rx="8" class="code"/>
  <text x="846" y="810" class="heading">Repository MCP</text>
  <text x="846" y="842" class="body">动态绑定固定源码快照</text>
  <text x="846" y="874" class="body">version-registry → ref / commit</text>
  <text x="846" y="908" class="small">rg 兜底 · 可选 CBM 结构导航</text>
  <text x="846" y="936" class="small">代码图节点 / 边只提供定位线索</text>
  <text x="846" y="970" class="small">read 原文后才形成 source 观测</text>
  <rect x="846" y="986" width="232" height="30" rx="6" class="tag"/>
  <text x="962" y="1006" text-anchor="middle" class="tag-text">提示词 + 日志事实选版本</text>

  <rect x="1190" y="770" width="310" height="270" rx="8" class="external"/>
  <text x="1216" y="810" class="heading">Agent Slot / A2A</text>
  <text x="1216" y="842" class="body">统一外部前端 / H5 / 服务端 Agent</text>
  <text x="1216" y="876" class="small">固定摘要 · digest · 超时 · CancelTask</text>
  <text x="1216" y="908" class="small">远端使用自己的代码、日志和知识</text>
  <text x="1216" y="940" class="small">返回任务状态与外部结论</text>
  <rect x="1216" y="974" width="232" height="38" rx="6" class="white"/>
  <text x="1332" y="990" text-anchor="middle" class="tiny">external_findings</text>
  <text x="1332" y="1005" text-anchor="middle" class="tiny">不伪装成本地证据</text>

  <path d="M 615 1040 V 1100" class="evidence-route"/>
  <path d="M 985 1040 V 1100" class="evidence-route"/>
  <path d="M 350 1100 H 985" class="bus"/>
  <path d="M 350 1100 V 1170" class="evidence-route"/>
  <text x="365" y="1092" class="route-label">匹配日志 / 回读源码</text>
  <path d="M 1345 1040 V 1170" class="external-route"/>

  <text x="80" y="1138" class="eyebrow">04  证据隔离与报告汇总</text>
  <rect x="90" y="1170" width="520" height="108" rx="8" class="ledger"/>
  <text x="116" y="1206" class="heading">EvidenceLedger · 本地事实</text>
  <text x="116" y="1236" class="body">source / log observation · evidence_refs</text>
  <text x="116" y="1262" class="small">只接受当前身份、目标绑定和固定快照下的实际观测</text>

  <rect x="700" y="1170" width="350" height="108" rx="8" class="external"/>
  <text x="726" y="1206" class="heading">ExternalFindings</text>
  <text x="726" y="1236" class="body">远端结论 · 任务状态 · 限制</text>
  <text x="726" y="1262" class="small">与本地 EvidenceLedger 永久分开</text>

  <rect x="1140" y="1170" width="360" height="108" rx="8" class="source"/>
  <text x="1166" y="1206" class="heading">本地 / 联合诊断报告</text>
  <text x="1166" y="1236" class="body">本地证据、外部结论、冲突与缺口</text>
  <text x="1166" y="1262" class="small">verified_claims 只能引用本地账本</text>

  <path d="M 350 1170 V 1152 H 1120 V 1170" class="evidence-route"/>
  <text x="780" y="1146" class="route-label">evidence_refs</text>
  <path d="M 1050 1248 H 1140" class="external-route"/>
  <text x="1060" y="1240" class="route-label">external_findings</text>

  <g transform="translate(80 1310)">
    <line x1="0" y1="0" x2="44" y2="0" class="route-dashed"/>
    <text x="56" y="4" class="tiny">线索 / 导航</text>
    <line x1="188" y1="0" x2="232" y2="0" class="evidence-route"/>
    <text x="244" y="4" class="tiny">本地实际观测</text>
    <line x1="430" y1="0" x2="474" y2="0" class="external-route"/>
    <text x="486" y="4" class="tiny">外部结论</text>
    <text x="740" y="4" class="tiny">Runtime 不直连第二套远端 Knowledge MCP；外部能力统一经 Agent Slot / A2A 接入</text>
  </g>
</svg>

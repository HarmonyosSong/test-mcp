<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">Troubleshoot Odyssey 并行 Agent 架构</title>
  <desc id="description">展示 Runtime Supervisor 的本地优先观察、条件并行、外发审批与结果聚合。客户端关联日志和源码进入 EvidenceLedger，Compass 结论进入 ExternalFindings，最后形成本地或联合报告。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16816f"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bd7415"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #26364b; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5f6f84; }
      .section { font-size: 13px; font-weight: 700; fill: #62738a; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 13px; fill: #506177; }
      .small { font-size: 12px; fill: #65758a; }
      .frame { fill: #fbfcfe; stroke: #dce3eb; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #b8c5d3; stroke-width: 1.5; }
      .client-frame { fill: #f5f8fc; stroke: #a9bdd6; stroke-width: 1.5; }
      .server-frame { fill: #f4fbf9; stroke: #9dc8bd; stroke-width: 1.5; }
      .runtime { fill: #eef3fb; stroke: #91a8c7; stroke-width: 1.7; }
      .client { fill: #ffffff; stroke: #8faacc; stroke-width: 1.7; }
      .server { fill: #ffffff; stroke: #83b9ad; stroke-width: 1.7; }
      .planned { fill: #fffaf0; stroke: #d99a3c; stroke-width: 1.7; stroke-dasharray: 7 5; }
      .data { fill: #f1f6ed; stroke: #a5bc89; stroke-width: 1.7; }
      .external { fill: #eef7f6; stroke: #83b9ad; stroke-width: 1.7; }
      .edge { fill: none; stroke: #718299; stroke-width: 2; marker-end: url(#arrow); }
      .edge-green { fill: none; stroke: #16816f; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-green); }
      .edge-orange { fill: none; stroke: #bd7415; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="54" y="56" class="title">Troubleshoot Odyssey | 并行 Agent 架构</text>
  <text x="54" y="84" class="subtitle">先本地观察，满足全部条件才并行；远端始终先审批，Runtime 负责聚合、边界和生命周期</text>

  <rect x="54" y="122" width="1292" height="112" rx="12" class="frame"/>
  <text x="78" y="151" class="section">01 · 统一入口与调查计划</text>
  <rect x="92" y="172" width="238" height="44" rx="8" class="box"/>
  <text x="112" y="200" class="heading">用户问题与上下文</text>
  <rect x="404" y="164" width="340" height="60" rx="8" class="runtime"/>
  <text x="428" y="191" class="heading">Runtime Supervisor</text>
  <text x="428" y="211" class="body">生成 InvestigationPlan · 检查授权与关联条件</text>
  <rect x="818" y="164" width="434" height="60" rx="8" class="runtime"/>
  <text x="842" y="191" class="heading">确定性调查策略</text>
  <text x="842" y="211" class="body">默认 local · 条件 parallel · 时间 / 调用 / handoff 预算</text>
  <path d="M 330 194 H 404" class="edge"/>
  <path d="M 744 194 H 818" class="edge"/>

  <rect x="54" y="270" width="622" height="328" rx="12" class="client-frame"/>
  <text x="78" y="300" class="section">02 · 客户端调查分支</text>
  <rect x="88" y="334" width="252" height="78" rx="8" class="client"/>
  <text x="112" y="367" class="heading">ClientDiagnosisAgent</text>
  <text x="112" y="391" class="body">知识候选 · LogCenter 观察 · 固定快照源码</text>
  <rect x="386" y="334" width="252" height="78" rx="8" class="client"/>
  <text x="410" y="367" class="heading">本地只读能力</text>
  <text x="410" y="391" class="body">Knowledge / Repository / 日志</text>
  <rect x="88" y="464" width="252" height="78" rx="8" class="data"/>
  <text x="112" y="497" class="heading">客户端事实</text>
  <text x="112" y="521" class="body">源码 / 关联日志 · 本地证据引用</text>
  <rect x="386" y="464" width="252" height="78" rx="8" class="data"/>
  <text x="410" y="497" class="heading">EvidenceLedger</text>
  <text x="410" y="521" class="body">仅登记实际源码与合格日志</text>
  <path d="M 520 224 V 254 H 214 V 328" class="edge"/>
  <text x="530" y="248" class="small">client 分支</text>
  <path d="M 340 373 H 386" class="edge"/>
  <path d="M 512 412 V 458" class="edge"/>
  <path d="M 386 503 H 346" class="edge"/>
  <text x="352" y="488" class="small">引用</text>

  <rect x="724" y="270" width="622" height="328" rx="12" class="server-frame"/>
  <text x="748" y="300" class="section">03 · 服务端调查分支</text>
  <rect x="758" y="334" width="252" height="78" rx="8" class="external"/>
  <text x="782" y="367" class="heading">审批 + A2A Agent Slot</text>
  <text x="782" y="391" class="body">固定摘要批准 → JSON-RPC · SSE</text>
  <rect x="1056" y="334" width="252" height="78" rx="8" class="server"/>
  <text x="1080" y="367" class="heading">远端 Agent</text>
  <text x="1080" y="391" class="body">云学习 / 服务端 / 专项知识与工具</text>
  <rect x="758" y="464" width="252" height="78" rx="8" class="external"/>
  <text x="782" y="497" class="heading">ExternalFindings</text>
  <text x="782" y="521" class="body">任务状态 · 外部结论 · 限制</text>
  <rect x="1056" y="464" width="252" height="78" rx="8" class="server"/>
  <text x="1080" y="497" class="heading">范围内自主探索</text>
  <text x="1080" y="521" class="body">不新增客户端数据，不扩大权限</text>
  <path d="M 700 224 V 254 H 884 V 328" class="edge-orange"/>
  <text x="710" y="248" class="small">批准后 server 分支</text>
  <path d="M 1010 373 H 1056" class="edge-green"/>
  <path d="M 1182 412 V 458" class="edge-green"/>
  <path d="M 1056 503 H 1016" class="edge-green"/>

  <rect x="54" y="652" width="1292" height="176" rx="12" class="frame"/>
  <text x="78" y="682" class="section">04 · Fan-in 聚合与下一步</text>
  <rect x="170" y="718" width="280" height="72" rx="8" class="runtime"/>
  <text x="194" y="750" class="heading">Supervisor 聚合</text>
  <text x="194" y="774" class="body">对齐本地证据、外部结论和冲突</text>
  <rect x="560" y="718" width="300" height="72" rx="8" class="data"/>
  <text x="584" y="750" class="heading">联合诊断报告</text>
  <text x="584" y="774" class="body">责任状态 · 已验证 · 缺口</text>
  <rect x="1050" y="718" width="200" height="72" rx="8" class="box"/>
  <text x="1074" y="750" class="heading">最终回复</text>
  <text x="1074" y="774" class="body">SSE / IM</text>
  <path d="M 214 542 V 636 H 230 V 712" class="edge"/>
  <path d="M 884 542 V 636 H 390 V 712" class="edge-green"/>
  <text x="240" y="626" class="small">客户端事实</text>
  <text x="400" y="626" class="small">外部结论</text>
  <path d="M 450 754 H 560" class="edge"/>
  <path d="M 860 754 H 1050" class="edge"/>
  <text x="78" y="814" class="small">本地报告给出明确跨侧问题时自动创建审批；parallel 必须已有 kind=log、服务端信号、请求关联、开关和预算。</text>

  <text x="78" y="850" class="small">关键边界：关联日志与实际源码进入 EvidenceLedger；A2A 结果进入 ExternalFindings；local-only 直接报告，有远端结果才联合判断。</text>
</svg>

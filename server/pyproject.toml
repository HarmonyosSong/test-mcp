[project]
name = "harmony-agent-server"
version = "0.1.0"
description = "FastAPI and AG-UI gateway for Harmony Agent"
requires-python = ">=3.11"
dependencies = [
  "ag-ui-protocol>=0.1.10,<1.0",
  "fastapi>=0.135,<1.0",
  "harmony-agent-core",
  "uvicorn[standard]>=0.41,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "ruff>=0.15,<1.0",
]

[project.scripts]
harmony-agent-server = "harmony_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmony_server"]

[tool.uv.sources]
harmony-agent-core = { path = "../agent", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

